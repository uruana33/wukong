name: Devin Max Auto-Build & Test

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'  # >=22.6 原生支持 --experimental-strip-types 运行 TS

    - name: Install Dependencies
      run: npm install

    - name: Typecheck & Tests
      run: npm test  # tsc --noEmit；接入单元测试后由同一入口扩展

    # 如果测试失败，触发 Devin 自愈机制
    - name: Trigger Devin Max Auto-Fix
      if: failure()
      run: |
        echo "Tests failed. Alerting Devin Max to analyze logs and submit a fix PR..."
